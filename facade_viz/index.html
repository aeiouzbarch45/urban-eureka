<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>

<title>Grand Commercial Façade Library — 96 Schematic Elevations</title>
<style>
  :root{
    --bg:#0f1419; --panel:#161d26; --panel2:#1d2733; --line:#2a3744;
    --text:#e7edf3; --muted:#9aa9b8; --accent:#4aa3df;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  header{padding:22px 26px 10px;border-bottom:1px solid var(--line);}
  h1{margin:0;font-size:20px;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .controls{display:flex;gap:12px;flex-wrap:wrap;padding:16px 26px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--bg);z-index:5}
  input,select{background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:9px 12px;font-size:14px;min-width:160px}
  input{flex:1;min-width:240px}
  .count{color:var(--muted);font-size:13px;align-self:center;margin-left:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding:22px 26px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    cursor:pointer;transition:transform .12s ease,border-color .12s ease}
  .card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .thumb{background:#eef3f7;display:block;width:100%;height:auto}
  .card .meta{padding:10px 12px 12px}
  .card .nm{font-size:14px;font-weight:600;line-height:1.25}
  .badge{display:inline-block;margin-top:7px;font-size:11px;color:var(--muted);
    background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
  .overlay{position:fixed;inset:0;background:rgba(6,9,13,.78);display:none;align-items:center;
    justify-content:center;padding:24px;z-index:50}
  .overlay.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:980px;
    width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:minmax(280px,420px) 1fr}
  .modal .left{background:#eef3f7;padding:16px;display:flex;align-items:center;justify-content:center}
  .modal .left img{width:100%;height:auto;border-radius:8px}
  .modal .right{padding:22px 24px}
  .modal h2{margin:0 0 4px;font-size:19px}
  .modal .cat{color:var(--accent);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .modal section{margin-top:18px}
  .modal h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 7px}
  .modal p{margin:0;font-size:14px;line-height:1.5;color:#d7e0e9}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 9px}
  .params{font-size:13px;line-height:1.5;color:#d7e0e9}
  .params li{margin-bottom:4px}
  pre{white-space:pre-wrap;font-size:13px;line-height:1.5;color:#cfd9e3;
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0}
  .close{position:absolute;top:14px;right:18px;font-size:22px;color:#fff;cursor:pointer;
    background:none;border:none}
  @media(max-width:720px){.modal{grid-template-columns:1fr}}
</style>
</head>

<script id="data" type="application/json">[{"id": "01_vertical_solar_fins", "name": "Rhythmic Vertical Solar Fins", "category": "Solar Shading & Louver Systems", "intent": "Cuts low-angle east/west glare on office monitors while preserving outward views.", "elements": ["Column", "Beam", "CurtainWall"], "parameters": {"module_spacing_m": [1.2, 1.5, 2.4], "fin_depth_m": [0.45, 0.6, 0.9], "fin_thickness_m": 0.12, "height_span": "full_story_height", "variation_mode": "uniform | sinusoidal_depth | denser_at_corners"}, "build_logic": "Query exterior perimeter edges per story. Subdivide edge length by module_spacing_m and place vertical members offset outward by half of fin_depth_m.", "svg": "svgs/01_vertical_solar_fins.svg"}, {"id": "02_horizontal_brise_soleil", "name": "Continuous & Staggered Horizontal Brise-Soleil", "category": "Solar Shading & Louver Systems", "intent": "Shades high-angle midday sun and emphasizes horizontal corporate floor plates.", "elements": ["Slab", "Beam"], "parameters": {"projection_depth_m": [0.8, 1.2, 1.6], "ledge_thickness_m": 0.25, "vertical_interval": "every_story | alternating_stories", "stagger_pattern": "continuous | staggered_bays"}, "build_logic": "Offset outer floor slab boundaries outward at each story elevation; optionally segment along bay widths and alternate projection depths between odd and even floors.", "svg": "svgs/02_horizontal_brise_soleil.svg"}, {"id": "03_angled_sawtooth_louvers", "name": "Asymmetric Sawtooth Orientation Fins", "category": "Solar Shading & Louver Systems", "intent": "Orients glazing toward north/indirect light while blocking harsh low-angle solar exposure.", "elements": ["Column", "Beam", "Wall"], "parameters": {"bay_module_m": [1.5, 2.0], "fin_depth_m": 0.75, "rotation_angle_deg": [30, 45, 60]}, "build_logic": "Place vertical fins at each module point rotated by rotation_angle_deg relative to the facade normal.", "svg": "svgs/03_angled_sawtooth_louvers.svg"}, {"id": "04_variable_density_gradient_louvers", "name": "Solar-Responsive Variable-Density Louvers", "category": "Solar Shading & Louver Systems", "intent": "Varies fin spacing and depth continuously across the elevation to shade high-exposure zones while opening view corridors.", "elements": ["Column", "Beam"], "parameters": {"min_spacing_m": 0.4, "max_spacing_m": 2.4, "min_depth_m": 0.25, "max_depth_m": 0.85, "gradient_axis": "horizontal_center_out | diagonal | solar_west_to_east"}, "build_logic": "Compute normalized position t (0 to 1) along the facade width/height and interpolate both spacing and fin depth using a smooth cosine or linear curve.", "svg": "svgs/04_variable_density_gradient_louvers.svg"}, {"id": "05_micro_horizontal_louver_veils", "name": "Stacked Multi-Blade Horizontal Louver Veil", "category": "Solar Shading & Louver Systems", "intent": "Suspends 3 to 5 slim horizontal blades per story in front of the curtain wall for diffused daylighting and sleek horizontal texture.", "elements": ["Beam", "Column"], "parameters": {"blades_per_story": [3, 4, 5], "blade_depth_m": 0.35, "blade_thickness_m": 0.06, "offset_from_glass_m": 0.45, "support_outrigger_spacing_m": 3.0}, "build_logic": "Place vertical support outriggers at structural bay intervals, then span continuous slim horizontal beams across each story subdivided by blades_per_story.", "svg": "svgs/05_micro_horizontal_louver_veils.svg"}, {"id": "06_structural_diagrid_exoskeleton", "name": "External Structural Diagrid", "category": "Structural Exoskeletons & Grids", "intent": "Transfers lateral loads to the perimeter, freeing interior office floor plates and creating an iconic diamond mesh.", "elements": ["Beam", "Column"], "parameters": {"diamond_width_m": [4.8, 6.0, 7.2], "diamond_height_stories": [2, 3], "member_section_m": [0.35, 0.45], "offset_from_glass_m": 0.3}, "build_logic": "Create a 2D grid of nodes along each facade plane spaced by diamond_width_m horizontally and diamond_height_stories vertically. Connect diagonal node pairs with inclined beams.", "svg": "svgs/06_structural_diagrid_exoskeleton.svg"}, {"id": "07_angular_truss_exoskeleton", "name": "Irregular Angular Truss Overlay", "category": "Structural Exoskeletons & Grids", "intent": "Adds dynamic visual energy to a regular glass box with multi-story intersecting zig-zag struts.", "elements": ["Beam"], "parameters": {"span_stories": [2, 4], "strut_section_m": [0.3, 0.4], "offset_from_facade_m": 0.35}, "build_logic": "Define alternating pivot points across multiple stories and bays on the outer facade plane and connect them with crisp linear structural beams.", "svg": "svgs/07_angular_truss_exoskeleton.svg"}, {"id": "08_voronoi_web_exoskeleton", "name": "Triangulated / Webbed Organic Exoskeleton", "category": "Structural Exoskeletons & Grids", "intent": "Wraps the curtain wall in a non-orthogonal triangulated structural web inspired by natural cellular geometry.", "elements": ["Beam", "Morph"], "parameters": {"cell_target_size_m": [3.5, 5.0], "jitter_factor": 0.35, "member_section_m": [0.28, 0.38], "offset_from_glass_m": 0.3}, "build_logic": "Generate a base grid on the facade plane, apply controlled pseudo-random XY displacement (jitter_factor) to interior nodes, triangulate adjacent nodes, and place connecting Beams.", "svg": "svgs/08_voronoi_web_exoskeleton.svg"}, {"id": "09_megacolumn_outrigger_frame", "name": "Perimeter Megacolumn & Multi-Story Outrigger Belt Frame", "category": "Structural Exoskeletons & Grids", "intent": "Expresses heavy corner/perimeter megacolumns tied together every 6–8 stories by double-height structural belt trusses.", "elements": ["Column", "Beam", "Wall"], "parameters": {"megacolumn_width_m": [1.2, 1.8], "megacolumn_depth_m": [1.0, 1.5], "belt_truss_interval_stories": [6, 8], "belt_truss_height_stories": 1}, "build_logic": "Place heavy vertical megacolumns at building corners and third-points, then span full-width diagonal or Vierendeel belt trusses across mechanical/refuge stories.", "svg": "svgs/09_megacolumn_outrigger_frame.svg"}, {"id": "10_vierendeel_stacked_grid", "name": "Exposed Vierendeel Structural Grid", "category": "Structural Exoskeletons & Grids", "intent": "Creates a crisp, monumental orthogonal structural cage around the glazed core with deep rigid-joint members.", "elements": ["Column", "Beam"], "parameters": {"bay_width_m": [3.6, 4.8], "column_section_m": [0.45, 0.65], "spandrel_beam_depth_m": [0.6, 0.85], "projection_from_glass_m": 0.45}, "build_logic": "Place continuous heavy vertical columns at every structural bay and flush horizontal spandrel beams at every floor slab edge.", "svg": "svgs/10_vierendeel_stacked_grid.svg"}, {"id": "11_cantilevered_office_volumes", "name": "Shifted Cantilevered Office Boxes", "category": "Massing & Volumetric Transformations", "intent": "Breaks down monolithic office tower massing into stacked collaborative zones and sky terraces.", "elements": ["Slab", "Wall", "CurtainWall"], "parameters": {"band_height_stories": [2, 3], "cantilever_offset_m": [1.2, 1.8, 2.4], "shift_pattern": "alternating_axes | stepped_spiral | upper_crown_only"}, "build_logic": "Group stories into 2-3 story bands; extend slab perimeter and perimeter enclosure outward along selected faces while keeping core geometry fixed.", "svg": "svgs/11_cantilevered_office_volumes.svg"}, {"id": "12_split_tower_skybridge", "name": "Split Twin-Tower Massing with Skybridges", "category": "Massing & Volumetric Transformations", "intent": "Carves a central atrium/canyon through the building massing, linking twin office wings with multi-level skybridges.", "elements": ["Slab", "CurtainWall", "Beam"], "parameters": {"central_gap_width_m": [4.0, 6.0], "skybridge_stories": [4, 8, 12], "skybridge_height_stories": 1}, "build_logic": "Divide the floor plate into two separate wing polygons separated by central_gap_width_m, then bridge across the gap on specified skybridge_stories.", "svg": "svgs/12_split_tower_skybridge.svg"}, {"id": "13_deep_vertical_slots", "name": "Deep Vertical Pier & Recessed Slot Massing", "category": "Massing & Volumetric Transformations", "intent": "Creates strong verticality and thermal mass protection by alternating opaque piers with recessed glazed slots.", "elements": ["Wall", "Column", "CurtainWall"], "parameters": {"pier_width_m": [1.2, 1.8], "slot_width_m": [1.8, 2.4], "pier_depth_m": [0.8, 1.2]}, "build_logic": "Alternate thick full-height opaque wall piers with recessed glazing panels along the building perimeter.", "svg": "svgs/13_deep_vertical_slots.svg"}, {"id": "14_carved_sky_garden_pockets", "name": "Carved Multi-Story Sky-Garden Atriums", "category": "Massing & Volumetric Transformations", "intent": "Subtracts 2-to-3 story corner or mid-facade volumes to create shaded outdoor collaborative terraces and planted sky gardens.", "elements": ["Slab", "CurtainWall", "Column"], "parameters": {"pocket_width_bays": [2, 3], "pocket_height_stories": [2, 3], "pocket_recess_depth_m": [3.0, 4.5], "spiral_step_per_tier": true}, "build_logic": "Recess slab edges and set back the curtain wall line by pocket_recess_depth_m across multi-story corner or alternating bays, leaving perimeter columns exposed.", "svg": "svgs/14_carved_sky_garden_pockets.svg"}, {"id": "15_stepped_terraced_setbacks", "name": "Stepped Ziggurat / Terraced Crown Setbacks", "category": "Massing & Volumetric Transformations", "intent": "Steps upper floor plates inward every 3–4 stories to create expansive rooftop terraces and reduce high-rise wind downdraft.", "elements": ["Slab", "CurtainWall", "Beam"], "parameters": {"tier_stories": [3, 4], "setback_increment_m": [1.8, 2.4], "setback_sides": "front_and_sides | asymmetric_south"}, "build_logic": "Divide the building height into tiers; inset the floor slab boundary and perimeter glazing inward by setback_increment_m at each upper tier.", "svg": "svgs/15_stepped_terraced_setbacks.svg"}, {"id": "16_corner_chamfer_and_crown_frame", "name": "Architectural Portal Frame & Corner Articulation", "category": "Massing & Volumetric Transformations", "intent": "Frames the entire tower elevation with a bold perimeter portal and chamfered or recessed corners.", "elements": ["Wall", "Slab", "Beam"], "parameters": {"portal_frame_width_m": [1.2, 1.8], "portal_projection_m": [0.8, 1.2], "crown_overheight_m": [3.0, 4.5]}, "build_logic": "Build thick perimeter framing piers on the outer bays and cap the top story with an extended portal roof beam.", "svg": "svgs/16_corner_chamfer_and_crown_frame.svg"}, {"id": "17_stepped_pixel_frames", "name": "Extruded Pixelated Window Frames", "category": "Modular & Pixelated Skins", "intent": "Provides self-shading deep reveals and varied visual depth across uniform office bays.", "elements": ["Beam", "Column", "Slab", "Morph"], "parameters": {"bay_width_m": [2.4, 3.0], "bay_height_stories": 1, "frame_thickness_m": 0.18, "projection_depths_m": [0.3, 0.6, 0.9], "distribution": "checkerboard | diagonal_gradient | clustered"}, "build_logic": "For each bay and story cell, generate a 4-sided perimeter box frame projecting outward by a depth selected from projection_depths_m.", "svg": "svgs/17_stepped_pixel_frames.svg"}, {"id": "18_irregular_framed_grid_louvers", "name": "Color-Accented Irregular Grid Frame with Variable Vertical Louvers", "category": "Modular & Pixelated Skins", "intent": "Creates a bold, contemporary grid of deep colored box frames subdivided by unevenly spaced vertical fins and occasional solid acoustic/privacy infill panels.", "elements": ["Beam", "Column", "Slab", "Wall"], "parameters": {"primary_grid_bay_m": [3.0, 3.6], "frame_depth_m": [0.8, 1.1], "frame_member_thickness_m": 0.15, "sub_fin_spacings_m": [0.4, 0.75, 1.2], "solid_infill_ratio": 0.15}, "build_logic": "Construct a continuous multi-story structural grid of horizontal and vertical box frames projecting forward of the glass line. Inside each bay cell, place 2 to 4 vertical louver fins at varied intervals and close off 10-20% of sub-bays with solid colored wall panels.", "svg": "svgs/18_irregular_framed_grid_louvers.svg"}, {"id": "19_faceted_folded_bay_windows", "name": "Folded / Pleated Sawtooth Curtain Wall Bays", "category": "Modular & Pixelated Skins", "intent": "Alternates inward and outward triangular glazing facets to create crystalline reflections and angled daylight capture.", "elements": ["CurtainWall", "Wall", "Slab"], "parameters": {"pleat_module_width_m": [2.4, 3.0], "pleat_apex_projection_m": [0.6, 0.9], "invert_every_story": true}, "build_logic": "Replace flat perimeter curtain wall segments with zig-zagging paired segments whose apex projects outward by pleat_apex_projection_m, optionally flipping phase on alternating stories.", "svg": "svgs/19_faceted_folded_bay_windows.svg"}, {"id": "20_staggered_masonry_punched_grid", "name": "Staggered Running-Bond Punched Stone/Terracotta Grid", "category": "Modular & Pixelated Skins", "intent": "Offsets solid cladding piers by half a bay on alternating floors to give a crafted, load-bearing tectonic rhythm.", "elements": ["Wall", "Slab", "Beam"], "parameters": {"window_width_m": [1.8, 2.4], "pier_width_m": [1.2, 1.5], "spandrel_height_m": 0.9, "wall_thickness_m": 0.45}, "build_logic": "Place thick spandrel bands at each slab edge and alternate solid wall piers with recessed glazing, shifting horizontal pier coordinates by half a module on even stories.", "svg": "svgs/20_staggered_masonry_punched_grid.svg"}, {"id": "21_timber_lattice_planter_portal", "name": "Framed Timber Diamond Lattice with Mid-Level Planter Band", "category": "Perforated, Cultural & Biophilic Screens", "intent": "Combines a deep concrete perimeter portal frame with warm timber diamond latticework across upper and ground levels, interrupted by a solid spandrel planter ledge.", "elements": ["Wall", "Slab", "Beam", "Morph"], "parameters": {"portal_frame_thickness_m": 0.45, "portal_depth_m": 0.9, "lattice_diamond_width_m": [1.2, 1.5], "lattice_member_section_m": [0.12, 0.25], "planter_spandrel_story": 2, "planter_band_height_m": 1.4}, "build_logic": "Build a thick outer perimeter portal frame (side walls + top/bottom slabs). Subdivide the ground-level and upper-level glazed openings into a diamond grid of intersecting diagonal timber beams, separated at mid-height by a solid cantilevered spandrel wall with a recessed planter trough.", "svg": "svgs/21_timber_lattice_planter_portal.svg"}, {"id": "22_geometric_mashrabiya_bay_columns", "name": "Vertical Geometric Mashrabiya Screen Bays & Deep Recessed Loggias", "category": "Perforated, Cultural & Biophilic Screens", "intent": "Anchors corner and intermediate structural bays with full-height intricate geometric filigree screens while keeping central bays open as shaded loggias.", "elements": ["Slab", "Wall", "Beam", "CurtainWall", "Morph"], "parameters": {"screen_bay_width_m": [1.8, 2.4], "loggia_recess_depth_m": [1.2, 1.5], "slab_band_thickness_m": 0.35, "parapet_step_counts": 3}, "build_logic": "Define continuous horizontal slab bands and thick structural piers across the elevation. Fill designated vertical accent bays with patterned geometric lattice panels, recess the glazing behind deep loggia balconies with glass balustrades, and cap the roofline with a stepped horizontal cornice.", "svg": "svgs/22_geometric_mashrabiya_bay_columns.svg"}, {"id": "23_folding_perforated_shutters", "name": "Bi-Fold Perforated Metal Shading Shutters", "category": "Perforated, Cultural & Biophilic Screens", "intent": "Simulates operable bi-fold perforated panels that open at varied angles across the facade for dynamic solar control and visual texture.", "elements": ["Wall", "CurtainWall", "Morph"], "parameters": {"panel_pair_width_m": [1.5, 2.4], "panel_thickness_m": 0.08, "fold_angles_deg": [15, 45, 75], "offset_from_glass_m": 0.35}, "build_logic": "For each bay module, place paired narrow vertical panels hinged at bay edges and rotated inward/outward at varied fold_angles_deg.", "svg": "svgs/23_folding_perforated_shutters.svg"}, {"id": "24_vertical_planter_trellis_grid", "name": "Biophilic Planter Trough & Cable Trellis Facade", "category": "Perforated, Cultural & Biophilic Screens", "intent": "Integrates continuous cantilevered planter troughs at slab edges with vertical trellis cables/fins for living green wall shading.", "elements": ["Slab", "Beam", "Column"], "parameters": {"planter_trough_width_m": 0.65, "planter_trough_depth_m": 0.55, "trellis_post_spacing_m": [1.2, 1.8], "interval_stories": [1, 2]}, "build_logic": "Project hollow/stepped planter ledges along slab edges and span slender vertical trellis columns between troughs.", "svg": "svgs/24_vertical_planter_trellis_grid.svg"}, {"id": "25_double_skin_catwalk_envelope", "name": "Ventilated Double-Skin Facade with Maintenance Catwalks", "category": "Double-Skin & Kinetic Envelopes", "intent": "Improves acoustic insulation and thermal buffer performance with an outer glazed screen and perimeter walkways.", "elements": ["CurtainWall", "Slab", "Column"], "parameters": {"cavity_depth_m": [0.9, 1.2], "catwalk_grating_thickness_m": 0.15, "outer_skin_type": "unitized_glass | perforated_metal_mesh"}, "build_logic": "Offset a secondary curtain wall layer outward by cavity_depth_m and place perforated horizontal catwalk slabs at each story level inside the cavity.", "svg": "svgs/25_double_skin_catwalk_envelope.svg"}, {"id": "26_shingled_overlapping_glass_scales", "name": "Tilted Shingled Glass-Scale Ventilated Skin", "category": "Double-Skin & Kinetic Envelopes", "intent": "Overlaps outward-tilted glass panels like fish scales to allow natural stack-effect ventilation while deflecting rain and glare.", "elements": ["CurtainWall", "Beam", "Morph"], "parameters": {"panel_width_m": [1.5, 2.0], "tilt_out_bottom_m": [0.25, 0.4], "vertical_overlap_m": 0.15}, "build_logic": "Place sloped glazing panels story-by-story with the top edge anchored at the slab and the bottom edge kicked outward by tilt_out_bottom_m.", "svg": "svgs/26_shingled_overlapping_glass_scales.svg"}, {"id": "27_sculptural_wavy_timber_ribbons", "name": "Undulating Sculptural Timber Ribbon & Cascading Terrace Facade", "category": "Sculptural & Parametric Signatures", "intent": "Wraps the building in fluid, wave-like timber-clad horizontal bands that swell into deep planter balconies and taper into open glazed terraces.", "elements": ["Slab", "Morph", "Beam", "CurtainWall"], "parameters": {"wave_amplitude_m": [0.9, 1.5], "wave_height_variation_m": [1.2, 2.8], "double_height_base_arch": true, "balcony_recess_depth_m": 1.2}, "build_logic": "Generate sinusoidal horizontal slab profiles at each floor level that shift phase per story, creating alternating deep solid wave bulges and open glazed recesses. Cladding bands are modeled as smooth curved Morph shells or segmented vertical-grain timber panels with glass railings behind.", "svg": "svgs/27_sculptural_wavy_timber_ribbons.svg"}, {"id": "28_stepped_ribbon_wrap", "name": "Parametric Stepped Helical Ribbon Wrap", "category": "Sculptural & Parametric Signatures", "intent": "Approximates a sweeping sculptural ribbon wrapping continuously around the tower using stepped horizontal/inclined segments.", "elements": ["Beam", "Slab", "Morph"], "parameters": {"ribbon_band_height_m": [1.2, 1.8], "ribbon_projection_m": [0.9, 1.4], "wrap_turns": [1.0, 1.5], "segments_per_story": 4}, "build_logic": "Interpolate elevation and horizontal position continuously around all four tower faces from base to crown, placing connected inclined beam/slab segments.", "svg": "svgs/28_stepped_ribbon_wrap.svg"}, {"id": "29_elliptical_ring_halo_loop", "name": "Monumental Architectural Ring / Elliptical Halo Loop", "category": "Sculptural & Parametric Signatures", "intent": "Projects a bold circular or tilted elliptical ring frame across the primary facade to create an unmistakable landmark silhouette.", "elements": ["Beam", "Morph"], "parameters": {"ring_diameter_ratio_to_width": [0.75, 0.95], "ring_section_width_m": [0.9, 1.4], "ring_projection_m": [1.2, 2.0], "tilt_angle_deg": [0, 15], "segments_count": 36}, "build_logic": "Compute 36 segmented points along a circle or tilted ellipse centered on the main elevation plane, project outward by ring_projection_m, and connect with heavy Beam or Morph segments.", "svg": "svgs/29_elliptical_ring_halo_loop.svg"}, {"id": "30_twisting_stepped_floorplate_torsion", "name": "Incremental Torsional / Twisting Floor-Plate Massing", "category": "Sculptural & Parametric Signatures", "intent": "Rotates each successive floor slab by a small fixed angle around the central elevator core to produce a dynamic spiraling tower.", "elements": ["Slab", "CurtainWall", "Column"], "parameters": {"rotation_per_story_deg": [1.5, 2.5, 3.0], "max_total_twist_deg": 45, "core_remains_orthogonal": true}, "build_logic": "Keep the central structural core fixed, and rotate the outer floor slab polygon and perimeter glazing vertices by (story_index * rotation_per_story_deg) around the core centroid.", "svg": "svgs/30_twisting_stepped_floorplate_torsion.svg"}, {"id": "31_travertine_stone_rainscreen", "name": "Travertine / Natural-Stone Rainscreen", "category": "Contemporary Material & Cladding Systems", "intent": "Creates a durable, prestigious façade using mechanically fixed natural-stone panels with ventilated cavities and expressed joints.", "elements": ["Wall", "Slab", "Beam", "Morph"], "parameters": {"panel_width_m": [0.6, 0.9, 1.2], "panel_height_m": [0.9, 1.2, 1.5], "panel_thickness_m": [0.03, 0.04, 0.05], "cavity_depth_m": 0.08, "joint_width_m": 0.01}, "build_logic": "Map the façade into a regular panel grid; place stone-finish panel elements with consistent open joints, subframe rails and cavity offsets. Coordinate panel joints with slab edges and openings.", "svg": "svgs/31_travertine_stone_rainscreen.svg"}, {"id": "32_terracotta_baguette_facade", "name": "Terracotta Baguette Screen", "category": "Contemporary Material & Cladding Systems", "intent": "Uses vertical or horizontal fired-clay baguettes to provide durable solar screening, texture and warm material character.", "elements": ["Beam", "Column", "Morph"], "parameters": {"baguette_spacing_m": [0.15, 0.2, 0.3], "baguette_depth_m": [0.05, 0.07, 0.1], "baguette_length_m": "story_height_or_bay_width", "orientation": "vertical | horizontal | mixed"}, "build_logic": "Generate carrier rails at each support level, then distribute terracotta baguette members along the façade grid. Keep a ventilated gap and terminate modules at corners and openings.", "svg": "svgs/32_terracotta_baguette_facade.svg"}, {"id": "33_uhpc_sculptural_panels", "name": "UHPC Sculptural Panel Façade", "category": "Contemporary Material & Cladding Systems", "intent": "Creates thin, durable, three-dimensional concrete panels with deep relief, folds or molded profiles.", "elements": ["Wall", "Morph", "Beam"], "parameters": {"panel_module_m": [1.2, 1.5, 2.4], "panel_thickness_m": [0.04, 0.06, 0.08], "relief_depth_m": [0.08, 0.15, 0.25], "pattern": "folded | ribbed | faceted"}, "build_logic": "Subdivide the elevation into replaceable panel modules; generate each panel as a shallow Morph or wall assembly with the selected relief profile and concealed support points.", "svg": "svgs/33_uhpc_sculptural_panels.svg"}, {"id": "34_grc_3d_cladding", "name": "Three-Dimensional GRC Cladding", "category": "Contemporary Material & Cladding Systems", "intent": "Adds lightweight sculpted glass-fibre-reinforced concrete modules for depth, shadow and controlled façade articulation.", "elements": ["Morph", "Wall", "Beam"], "parameters": {"module_width_m": [1.2, 1.5, 1.8], "module_height_m": [1.2, 1.5, 3.0], "projection_m": [0.15, 0.3, 0.45], "surface_pattern": "smooth | ribbed | folded"}, "build_logic": "Create repeated shallow 3D panel modules on a secondary support grid. Vary panel depth or profile by bay while preserving clearances around windows and access zones.", "svg": "svgs/34_grc_3d_cladding.svg"}, {"id": "35_exposed_architectural_concrete", "name": "Exposed Architectural Concrete Façade", "category": "Contemporary Material & Cladding Systems", "intent": "Expresses structure and material mass through board-formed, ribbed or smooth architectural concrete surfaces.", "elements": ["Wall", "Column", "Beam", "Slab"], "parameters": {"surface_finish": "board_formed | smooth | bush_hammered", "panel_joint_spacing_m": [3.0, 3.6, 4.8], "rib_depth_m": [0.05, 0.1, 0.15], "opening_reveal_m": [0.15, 0.3, 0.45]}, "build_logic": "Organize concrete wall panels and structural bands around the building grid. Model expressed construction joints, deep window reveals and consistent floor-level datum lines.", "svg": "svgs/35_exposed_architectural_concrete.svg"}, {"id": "36_weathering_steel_screen", "name": "Weathering-Steel Perforated Screen", "category": "Contemporary Material & Cladding Systems", "intent": "Introduces a durable oxidized-metal outer layer with controlled perforation, depth and warm industrial character.", "elements": ["Morph", "Wall", "Beam", "Column"], "parameters": {"screen_thickness_m": 0.01, "panel_width_m": [1.2, 1.5, 2.4], "perforation_ratio": [0.2, 0.35, 0.5], "offset_from_glass_m": [0.3, 0.6, 0.9]}, "build_logic": "Place a secondary metal-screen plane outside the glazing; divide it into maintainable panels and apply a perforation pattern while retaining opaque edge zones and access clearances.", "svg": "svgs/36_weathering_steel_screen.svg"}, {"id": "37_ceramic_ventilated_facade", "name": "Ceramic Ventilated Rainscreen", "category": "Contemporary Material & Cladding Systems", "intent": "Uses replaceable ceramic plates on a ventilated subframe for weather protection, color and long-term maintainability.", "elements": ["Wall", "Beam", "Column", "Morph"], "parameters": {"tile_width_m": [0.3, 0.6, 0.9], "tile_height_m": [0.6, 0.9, 1.2], "cavity_depth_m": 0.1, "joint_width_m": 0.008}, "build_logic": "Lay out ceramic modules on a ventilated rail grid, align joints with openings where practical, and create separate panel groups by elevation for maintenance.", "svg": "svgs/37_ceramic_ventilated_facade.svg"}, {"id": "38_brick_lattice_facade", "name": "Perforated Brick Lattice Façade", "category": "Contemporary Material & Cladding Systems", "intent": "Uses patterned brickwork and voids to provide privacy, filtered daylight and passive ventilation.", "elements": ["Wall", "Morph", "Beam"], "parameters": {"brick_module_m": [0.1, 0.2, 0.3], "screen_thickness_m": [0.12, 0.24, 0.36], "void_ratio": [0.25, 0.4, 0.55], "bond_pattern": "stack_bond | diagonal | woven"}, "build_logic": "Generate a brick module grid and selectively omit or rotate units to form the selected lattice. Provide solid edge piers, lintel support and a stable base course.", "svg": "svgs/38_brick_lattice_facade.svg"}, {"id": "39_parametric_wave_pattern", "name": "Parametric Wave-Pattern Façade", "category": "Parametric & Computational Geometry", "intent": "Creates a continuous wave-like relief whose amplitude and frequency can respond to orientation and program.", "elements": ["Morph", "Beam", "CurtainWall"], "parameters": {"wave_amplitude_m": [0.15, 0.3, 0.6], "wave_period_m": [2.4, 3.6, 4.8], "panel_height_m": [1.2, 1.5, 3.0], "wave_axis": "horizontal | vertical"}, "build_logic": "Sample a sinusoidal surface across the façade domain, subdivide it into buildable panels and generate a supporting rail grid. Keep panel edges and offsets within fabrication limits.", "svg": "svgs/39_parametric_wave_pattern.svg"}, {"id": "40_algorithmic_cellular_facade", "name": "Algorithmic Cellular Panel Façade", "category": "Parametric & Computational Geometry", "intent": "Uses a controlled field of polygonal cells to create a distinctive porous or solid gradient across the elevation.", "elements": ["Morph", "Beam", "Wall"], "parameters": {"cell_size_m": [0.6, 0.9, 1.2], "cell_shape": "hexagonal | triangular | irregular_polygon", "porosity_ratio": [0.2, 0.35, 0.5], "gradient": "uniform | denser_at_base | denser_at_sunward_side"}, "build_logic": "Generate a 2D cell tessellation on each elevation, clip it to the façade boundary, then extrude selected cell boundaries or infill panels and add perimeter support rails.", "svg": "svgs/40_algorithmic_cellular_facade.svg"}, {"id": "41_gradient_perforation", "name": "Gradient Perforated Metal Façade", "category": "Parametric & Computational Geometry", "intent": "Transitions from open to dense perforation to balance views, privacy, daylight and solar control.", "elements": ["Morph", "Wall", "Beam"], "parameters": {"perforation_diameter_m": [0.01, 0.02, 0.04], "open_area_ratio": [0.1, 0.25, 0.4], "panel_module_m": [1.2, 1.5, 2.4], "gradient_axis": "bottom_to_top | center_out | solar_exposure"}, "build_logic": "Create panel boundaries and distribute perforations using a normalized gradient field. Preserve minimum edge distances, opaque fixing strips and panelized replacement zones.", "svg": "svgs/41_gradient_perforation.svg"}, {"id": "42_recursive_geometric_facade", "name": "Recursive Geometric Screen", "category": "Parametric & Computational Geometry", "intent": "Builds a hierarchical pattern from repeated subdivisions, producing visual complexity from a simple base geometry.", "elements": ["Morph", "Beam"], "parameters": {"base_module_m": [1.2, 1.8, 2.4], "recursion_levels": [2, 3, 4], "subdivision_rule": "quadrant | triangle | hexagonal", "relief_depth_m": [0.05, 0.1, 0.2]}, "build_logic": "Start with a base panel grid and recursively subdivide selected cells according to the chosen rule. Convert final edges and infill regions into manageable Morph or Beam elements.", "svg": "svgs/42_recursive_geometric_facade.svg"}, {"id": "43_parametric_triangular_folds", "name": "Parametric Triangular Folding Façade", "category": "Parametric & Computational Geometry", "intent": "Uses alternating triangular facets to create a folded surface with changing light and shadow.", "elements": ["Morph", "CurtainWall", "Beam"], "parameters": {"fold_module_width_m": [1.2, 1.8, 2.4], "fold_depth_m": [0.2, 0.4, 0.6], "fold_angle_deg": [15, 30, 45], "phase": "alternating | grouped"}, "build_logic": "Triangulate the façade plane into alternating facets, offset fold vertices by the selected depth and generate panel surfaces with a secondary support framework.", "svg": "svgs/43_parametric_triangular_folds.svg"}, {"id": "44_3d_voronoi_panels", "name": "Three-Dimensional Voronoi Panel Skin", "category": "Parametric & Computational Geometry", "intent": "Creates an organic cellular panel network with controlled cell size and variable density.", "elements": ["Morph", "Beam"], "parameters": {"seed_spacing_m": [1.5, 2.0, 3.0], "cell_size_m": [2.0, 3.5, 5.0], "jitter_factor": [0.1, 0.25, 0.4], "member_width_m": [0.08, 0.12, 0.18]}, "build_logic": "Generate seed points within the elevation boundary, compute clipped Voronoi cells, and convert selected cell edges into members or infill surfaces. Use deterministic seeds for repeatability.", "svg": "svgs/44_3d_voronoi_panels.svg"}, {"id": "45_fractal_geometric_screen", "name": "Fractal Geometric Screen", "category": "Parametric & Computational Geometry", "intent": "Applies self-similar geometric motifs at multiple scales to create a layered, recognizable façade pattern.", "elements": ["Morph", "Beam", "Wall"], "parameters": {"primary_module_m": [1.2, 1.8, 2.4], "scale_ratio": [0.33, 0.5, 0.67], "recursion_depth": [2, 3, 4], "screen_depth_m": [0.15, 0.3, 0.45]}, "build_logic": "Construct a primary motif, recursively scale and repeat it within each bay, then merge or group repeated geometry to keep the Archicad model efficient.", "svg": "svgs/45_fractal_geometric_screen.svg"}, {"id": "46_topology_optimized_screen", "name": "Topology-Inspired Branching Screen", "category": "Parametric & Computational Geometry", "intent": "Uses branching, load-path-inspired patterns to create a visually lightweight screen; geometry is conceptual unless structurally engineered.", "elements": ["Morph", "Beam", "Column"], "parameters": {"bay_width_m": [3.0, 4.5, 6.0], "branch_depth_m": [0.2, 0.4, 0.6], "member_width_m": [0.08, 0.12, 0.2], "branch_order": [2, 3, 4]}, "build_logic": "Create a branching pattern between defined support nodes, clip it to each bay and convert branches to beams or Morph members. Flag all members as conceptual pending structural design.", "svg": "svgs/46_topology_optimized_screen.svg"}, {"id": "47_honeycomb_inspired_facade", "name": "Honeycomb-Inspired Façade", "category": "Organic & Biomimetic Façades", "intent": "Uses hexagonal cells to provide a legible modular screen with adjustable transparency and depth.", "elements": ["Morph", "Beam", "Wall"], "parameters": {"cell_width_m": [0.3, 0.45, 0.6], "cell_depth_m": [0.1, 0.2, 0.3], "open_ratio": [0.25, 0.4, 0.6], "orientation_deg": [0, 15, 30]}, "build_logic": "Tile hexagonal cells across the façade, clip boundary cells, and create either open frames or solid infill cells according to the selected openness ratio.", "svg": "svgs/47_honeycomb_inspired_facade.svg"}, {"id": "48_leaf_vein_facade", "name": "Leaf-Vein Inspired Structural Screen", "category": "Organic & Biomimetic Façades", "intent": "Translates branching leaf-vein geometry into a shading framework with a strong central spine and secondary ribs.", "elements": ["Beam", "Morph", "Column"], "parameters": {"primary_spine_width_m": [0.12, 0.18, 0.25], "secondary_rib_width_m": [0.06, 0.1, 0.14], "rib_spacing_m": [0.6, 0.9, 1.2], "branch_angle_deg": [25, 35, 45]}, "build_logic": "Place a primary spine along each bay or screen panel, branch secondary ribs toward the perimeter and connect to defined anchors. Avoid implying structural adequacy.", "svg": "svgs/48_leaf_vein_facade.svg"}, {"id": "49_tree_branch_facade", "name": "Tree-Branch Column and Screen Façade", "category": "Organic & Biomimetic Façades", "intent": "Uses branching vertical supports to create a natural canopy-like façade structure and shaded public edges.", "elements": ["Column", "Beam", "Morph"], "parameters": {"trunk_section_m": [0.2, 0.3, 0.45], "branch_section_m": [0.1, 0.15, 0.2], "branch_levels": [2, 3, 4], "branch_angle_deg": [20, 35, 50]}, "build_logic": "Create a trunk line at selected grid points and branch toward upper support nodes. Connect branch ends with horizontal members and check clearances against windows.", "svg": "svgs/49_tree_branch_facade.svg"}, {"id": "50_coral_inspired_facade", "name": "Coral-Inspired Porous Façade", "category": "Organic & Biomimetic Façades", "intent": "Creates an irregular porous relief inspired by coral formations, balancing visual texture with filtered light.", "elements": ["Morph", "Beam"], "parameters": {"porosity_ratio": [0.25, 0.4, 0.55], "relief_depth_m": [0.15, 0.3, 0.5], "feature_size_m": [0.3, 0.6, 0.9], "density": "uniform | clustered | gradient"}, "build_logic": "Generate clustered porous panel geometry within panel boundaries, maintain continuous fixing zones and simplify complex surfaces into fabrication-friendly modules.", "svg": "svgs/50_coral_inspired_facade.svg"}, {"id": "51_butterfly_wing_facade", "name": "Butterfly-Wing Layered Screen", "category": "Organic & Biomimetic Façades", "intent": "Uses overlapping scales and angled panels to create iridescent visual layering and solar filtering.", "elements": ["Morph", "Beam", "CurtainWall"], "parameters": {"scale_width_m": [0.3, 0.45, 0.6], "overlap_m": [0.05, 0.1, 0.15], "tilt_deg": [10, 20, 30], "layer_offset_m": [0.1, 0.2, 0.3]}, "build_logic": "Place overlapping shingle-like panels in rows with alternating tilt and offset. Keep the inner weather line continuous and use a separate outer screen layer.", "svg": "svgs/51_butterfly_wing_facade.svg"}, {"id": "52_cellular_biological_facade", "name": "Cellular Biological Relief Façade", "category": "Organic & Biomimetic Façades", "intent": "Creates a soft cellular relief with variable cell scale and depth to evoke biological growth patterns.", "elements": ["Morph", "Wall"], "parameters": {"cell_diameter_m": [0.2, 0.4, 0.8], "relief_depth_m": [0.05, 0.12, 0.2], "density": [0.4, 0.6, 0.8], "distribution": "regular | clustered | gradient"}, "build_logic": "Populate a façade panel with controlled cellular units, vary scale and relief using a bounded field, and group panels by story to simplify editing.", "svg": "svgs/52_cellular_biological_facade.svg"}, {"id": "53_automated_rotating_solar_louvers", "name": "Automated Rotating Solar Louvers", "category": "Adaptive & Intelligent Façades", "intent": "Represents adjustable louvers that rotate to manage direct sun while maintaining views and daylight.", "elements": ["Beam", "Morph", "Column"], "parameters": {"blade_width_m": [0.15, 0.25, 0.35], "blade_spacing_m": [0.2, 0.35, 0.5], "rotation_range_deg": [0, 45, 90], "axis": "horizontal | vertical"}, "build_logic": "Create louver blades around defined pivot axes and expose rotation as a parameter or option set. Model representative open, intermediate and closed states; no live controls are implied.", "svg": "svgs/53_automated_rotating_solar_louvers.svg"}, {"id": "54_origami_folding_facade", "name": "Origami Folding Panel Façade", "category": "Adaptive & Intelligent Façades", "intent": "Uses hinged folded panels to create variable depth, shadow and privacy through a deployable geometric language.", "elements": ["Morph", "Beam", "Wall"], "parameters": {"panel_width_m": [0.6, 0.9, 1.2], "fold_angle_deg": [15, 30, 60], "fold_depth_m": [0.2, 0.4, 0.6], "fold_pattern": "mountain_valley | radial | alternating"}, "build_logic": "Generate hinged panel pairs with shared pivot lines and create named configuration options. Keep panel geometry clear of adjacent panels throughout the specified motion range.", "svg": "svgs/54_origami_folding_facade.svg"}, {"id": "55_responsive_kinetic_panels", "name": "Responsive Kinetic Panel Array", "category": "Adaptive & Intelligent Façades", "intent": "Arranges individually adjustable panels in a coordinated array for changing shade, privacy and façade expression.", "elements": ["Morph", "Beam"], "parameters": {"panel_module_m": [0.6, 0.9, 1.2], "panel_depth_m": [0.08, 0.12, 0.18], "rotation_range_deg": [0, 30, 60], "control_grouping": "per_panel | per_bay | per_story"}, "build_logic": "Place panel units on a regular support grid, define pivot locations and group panels by control zone. Generate static study states and document the assumed control logic.", "svg": "svgs/55_responsive_kinetic_panels.svg"}, {"id": "56_automated_shading_screen", "name": "Automated Sliding Shading Screen", "category": "Adaptive & Intelligent Façades", "intent": "Uses sliding screen panels that move along tracks to shade selected parts of the glazing.", "elements": ["Morph", "Beam", "Column"], "parameters": {"screen_width_m": [1.2, 1.8, 2.4], "track_offset_m": [0.15, 0.25, 0.4], "travel_distance_m": [0.6, 1.2, 2.4], "screen_type": "perforated_metal | expanded_mesh | louvered"}, "build_logic": "Create top and bottom guide tracks, panel carriages and screen panels. Provide open, partially closed and closed study positions with travel limits.", "svg": "svgs/56_automated_shading_screen.svg"}, {"id": "57_electrochromic_glazing", "name": "Electrochromic Smart-Glazing Façade", "category": "Adaptive & Intelligent Façades", "intent": "Represents glazing zones that change tint to reduce glare and solar gain while retaining transparency.", "elements": ["CurtainWall", "Wall"], "parameters": {"glazing_module_m": [1.2, 1.5, 1.8], "tint_states": "clear | intermediate | dark", "zone_size": "single_panel | bay | full_elevation", "frame_depth_m": [0.08, 0.12, 0.18]}, "build_logic": "Divide curtain wall panels into controllable zones and assign distinct surface options for clear, intermediate and dark states. This is a visual BIM representation, not an electrical control system.", "svg": "svgs/57_electrochromic_glazing.svg"}, {"id": "58_climate_responsive_facade", "name": "Climate-Responsive Hybrid Façade", "category": "Adaptive & Intelligent Façades", "intent": "Combines operable shading, ventilation openings and opaque insulation zones according to orientation and climate strategy.", "elements": ["CurtainWall", "Wall", "Morph", "Beam"], "parameters": {"vent_panel_ratio": [0.1, 0.2, 0.3], "shade_projection_m": [0.3, 0.6, 0.9], "opaque_zone_ratio": [0.2, 0.35, 0.5], "orientation_response": "east_west_priority | equatorial_sun | user_defined"}, "build_logic": "Classify elevation zones by orientation, place operable vent modules and shading components, and retain a continuous weather barrier. Performance requires project-specific simulation.", "svg": "svgs/58_climate_responsive_facade.svg"}, {"id": "59_bipv_facade", "name": "Building-Integrated Photovoltaic Façade", "category": "Sustainable & Energy-Generating Façades", "intent": "Integrates photovoltaic modules into opaque or vision façade zones to contribute on-site electricity generation.", "elements": ["CurtainWall", "Wall", "Morph", "Beam"], "parameters": {"module_width_m": [0.6, 1.0, 1.2], "module_height_m": [1.0, 1.5, 2.0], "tilt_deg": [0, 10, 20], "coverage_ratio": [0.2, 0.4, 0.6]}, "build_logic": "Map suitable façade zones, place PV panel modules with consistent access and joint spacing, and reserve routes for conceptual cabling. Electrical yield and fire compliance require specialist design.", "svg": "svgs/59_bipv_facade.svg"}, {"id": "60_pv_shading_canopy", "name": "Solar-PV Shading Canopy Façade", "category": "Sustainable & Energy-Generating Façades", "intent": "Combines external shading canopies with photovoltaic surfaces over windows, terraces or entrances.", "elements": ["Slab", "Beam", "Column", "Morph"], "parameters": {"canopy_projection_m": [0.9, 1.2, 1.8], "panel_tilt_deg": [5, 10, 15], "support_spacing_m": [2.4, 3.6, 4.8], "blade_depth_m": [0.2, 0.3, 0.45]}, "build_logic": "Extend canopy support beams from the structural grid, place PV panel surfaces at the selected tilt and coordinate drainage, maintenance access and façade clearances.", "svg": "svgs/60_pv_shading_canopy.svg"}, {"id": "61_algae_bioreactor_facade", "name": "Algae-Bioreactor Panel Façade", "category": "Sustainable & Energy-Generating Façades", "intent": "Uses translucent vertical photobioreactor panels as a conceptual environmental and educational façade feature.", "elements": ["CurtainWall", "Wall", "Beam", "Morph"], "parameters": {"panel_width_m": [0.6, 0.9, 1.2], "panel_depth_m": [0.08, 0.12, 0.18], "service_gap_m": [0.3, 0.45, 0.6], "panel_height": "story_height"}, "build_logic": "Create modular translucent panel units with service access zones and support rails. Represent pipework schematically only; specialist process, water and maintenance design is required.", "svg": "svgs/61_algae_bioreactor_facade.svg"}, {"id": "62_living_green_facade", "name": "Living Green Wall Façade", "category": "Sustainable & Energy-Generating Façades", "intent": "Integrates planted modules, irrigation zones and maintenance access to provide a vegetated façade layer.", "elements": ["Wall", "Beam", "Column", "Morph"], "parameters": {"planter_module_m": [0.6, 0.9, 1.2], "substrate_depth_m": [0.12, 0.2, 0.3], "support_offset_m": [0.15, 0.3, 0.45], "coverage_ratio": [0.3, 0.5, 0.7]}, "build_logic": "Place planter trays or modular green-wall panels on a secondary frame, reserve irrigation and drainage routes, and maintain access to windows and façade inspection zones.", "svg": "svgs/62_living_green_facade.svg"}, {"id": "63_vertical_farming_facade", "name": "Vertical Farming Screen Façade", "category": "Sustainable & Energy-Generating Façades", "intent": "Combines productive planting racks with a ventilated outer screen on suitable service-oriented elevations.", "elements": ["Beam", "Column", "Slab", "Morph"], "parameters": {"rack_depth_m": [0.45, 0.6, 0.9], "rack_spacing_m": [0.6, 0.9, 1.2], "growing_bed_depth_m": [0.2, 0.3, 0.45], "service_aisle_m": [0.6, 0.9, 1.2]}, "build_logic": "Generate stacked growing racks with support frames, service aisles and , "Wall"], "parameters": {"module_width_m": [0.6, 0.9, 1.2], "screen_depth_m": [0.1, 0.2, 0.3], "pattern_density": "open | medium | dense", "motif_source": "user_selected_reference"}, "build_logic": "Ask the user for an approved cultural reference or motif before generating. Build a modular screen from the supplied geometry and avoid inventing culturally specific symbols.", "svg": "svgs/66_contemporary_ethiopian_geometric.svg"}, {"id": "67_ethiopian_lattice_facade", "name": "Ethiopian-Inspired Contemporary Lattice", "category": "Traditional & Cultural Architectural Façades", "intent": "Creates a layered lattice screen with locally contextualized proportions and filtered light.", "elements": ["Morph", "Beam", "Column"], "parameters": {"lattice_module_m": [0.3, 0.45, 0.6], "member_width_m": [0.04, 0.06, 0.1], "screen_offset_m": [0.3, 0.45, 0.6], "pattern": "rectilinear | diagonal | user_reference"}, "build_logic": "Use a user-approved reference pattern to generate a repeatable lattice between structural supports. Keep the pattern editable and avoid presenting the result as an exact traditional reconstruction.", "svg": "svgs/67_ethiopian_lattice_facade.svg"}, {"id": "68_islamic_mashrabiya_variation", "name": "Contemporary Islamic Mashrabiya Screen", "category": "Traditional & Cultural Architectural Façades", "intent": "Adapts geometric privacy screens to contemporary façade modules, balancing filtered views, daylight and ventilation.", "elements": ["Morph", "Beam", "Wall"], "parameters": {"module_width_m": [0.6, 0.9, 1.2], "pattern_scale_m": [0.1, 0.2, 0.3], "screen_depth_m": [0.15, 0.3, 0.45], "porosity_ratio": [0.2, 0.35, 0.5]}, "build_logic": "Generate a mathematically consistent geometric screen from a selected pattern family, panelize it by bay and provide opaque fixing borders and maintenance access.", "svg": "svgs/68_islamic_mashrabiya_variation.svg"}, {"id": "69_african_geometric_screen", "name": "Contemporary African Geometric Screen", "category": "Traditional & Cultural Architectural Façades", "intent": "Uses abstract geometric rhythm and layered shading as a contemporary regional design language.", "elements": ["Morph", "Beam", "Wall"], "parameters": {"bay_width_m": [1.2, 1.8, 2.4], "pattern_depth_m": [0.1, 0.2, 0.3], "repeat_scale_m": [0.3, 0.6, 0.9], "pattern_source": "user_selected_reference"}, "build_logic": "Request a specific regional or user-supplied reference before choosing motifs. Translate the approved pattern into modular panels and preserve its proportions.", "svg": "svgs/69_african_geometric_screen.svg"}, {"id": "70_arabic_architectural_screen", "name": "Contemporary Arabic Screen and Arcade Façade", "category": "Traditional & Cultural Architectural Façades", "intent": "Combines deep shaded openings, arcaded proportions and patterned screens for a climate-conscious civic or commercial elevation.", "elements": ["Wall", "Column", "Beam", "Morph"], "parameters": {"arcade_bay_m": [2.4, 3.0, 3.6], "arch_rise_ratio": [0.25, 0.4, 0.5], "screen_depth_m": [0.15, 0.3, 0.45], "opening_type": "pointed | horseshoe | rectilinear"}, "build_logic": "Lay out arcade bays on the structural grid, create selected opening profiles and insert patterned screen panels where required. Confirm reference style with the user.", "svg": "svgs/70_arabic_architectural_screen.svg"}, {"id": "71_contemporary_carved_stone", "name": "Contemporary Carved-Stone Relief Façade", "category": "Traditional & Cultural Architectural Façades", "intent": "Uses shallow carved relief and deep reveals to create a tactile stone façade with controlled shadow.", "elements": ["Wall", "Morph"], "parameters": {"panel_width_m": [0.6, 0.9, 1.2], "relief_depth_m": [0.03, 0.06, 0.12], "motif_scale_m": [0.2, 0.4, 0.6], "pattern_source": "user_selected_reference"}, "build_logic": "Generate shallow relief panels from user-approved motifs, panelize them for fabrication and retain flat fixing zones around panel edges.", "svg": "svgs/71_contemporary_carved_stone.svg"}, {"id": "72_courtyard_inspired_facade", "name": "Courtyard-Inspired Layered Façade", "category": "Traditional & Cultural Architectural Façades", "intent": "Reinterprets inward-facing courtyard logic through recessed balconies, shaded loggias and layered privacy screens.", "elements": ["Slab", "Wall", "CurtainWall", "Beam"], "parameters": {"loggia_depth_m": [1.2, 1.8, 2.4], "balcony_interval_stories": [1, 2, 3], "screen_offset_m": [0.3, 0.6, 0.9], "opening_ratio": [0.25, 0.4, 0.55]}, "build_logic": "Recess selected façade bays to form loggias, add slab bands and place privacy screens at the outer edge. Coordinate with egress, drainage and usable floor area.", "svg": "svgs/72_courtyard_inspired_facade.svg"}, {"id": "73_vertical_spine_tower", "name": "Vertical Spine and Shadow-Gap Tower Façade", "category": "High-Rise Architectural Expression", "intent": "Emphasizes tower height with continuous vertical piers, deep shadow gaps and a disciplined window rhythm.", "elements": ["Column", "Beam", "Wall", "CurtainWall"], "parameters": {"spine_width_m": [0.6, 0.9, 1.2], "projection_m": [0.2, 0.4, 0.6], "bay_spacing_m": [3.0, 3.6, 4.8], "spine_material": "metal | stone | concrete"}, "build_logic": "Place continuous vertical spine elements aligned to the structural grid, interrupt them at movement joints and coordinate transitions at podium and crown.", "svg": "svgs/73_vertical_spine_tower.svg"}, {"id": "74_tower_podium_transition", "name": "Expressive Tower-and-Podium Transition", "category": "High-Rise Architectural Expression", "intent": "Creates a clear architectural hierarchy between public podium, intermediate transfer zone and tower volume.", "elements": ["Slab", "Wall", "CurtainWall", "Beam", "Column"], "parameters": {"podium_height_stories": [2, 3, 4], "tower_setback_m": [1.2, 2.4, 3.6], "transfer_band_height_m": [1.5, 3.0, 4.5], "canopy_projection_m": [1.2, 1.8, 2.4]}, "build_logic": "Separate podium and tower façade zones, model transition bands and setbacks, and align e band orientation from base to crown while keeping the primary envelope and structural grid unchanged. Panelize the twist into manageable segments.", "svg": "svgs/77_twisted_vertical_bands.svg"}, {"id": "78_expressive_mechanical_belts", "name": "Expressive Mechanical-Floor Belt Façade", "category": "High-Rise Architectural Expression", "intent": "Turns mechanical and refuge levels into deliberate horizontal architectural bands that articulate the tower.", "elements": ["Beam", "Wall", "Morph", "Slab"], "parameters": {"belt_height_m": [1.5, 3.0, 4.5], "projection_m": [0.3, 0.6, 0.9], "interval_stories": [6, 8, 10], "screen_type": "perforated | louvered | solid_ribbed"}, "build_logic": "Identify designated service levels and create a continuous belt expression around the perimeter. Preserve required ventilation, access and fire-service openings.", "svg": "svgs/78_expressive_mechanical_belts.svg"}, {"id": "79_monolithic_minimalist_facade", "name": "Monolithic Minimalist Façade", "category": "Minimalist & Contemporary Façades", "intent": "Creates a calm, unified exterior through large-format surfaces, restrained joints and carefully proportioned openings.", "elements": ["Wall", "Slab", "CurtainWall"], "parameters": {"panel_module_m": [1.2, 2.4, 3.6], "joint_width_m": [0.005, 0.01, 0.015], "reveal_depth_m": [0.05, 0.1, 0.15], "finish": "smooth_concrete | stone | metal"}, "build_logic": "Establish a consistent façade datum and large panel grid, align openings and joints, and minimize visible trim while preserving drainage and movement joints.", "svg": "svgs/79_monolithic_minimalist_facade.svg"}, {"id": "80_recessed_window_punches", "name": "Deep-Reveal Punched-Window Façade", "category": "Minimalist & Contemporary Façades", "intent": "Uses deeply recessed windows in a solid wall plane to create strong shadow, privacy and solar protection.", "elements": ["Wall", "Morph", "Slab"], "parameters": {"window_width_m": [1.2, 1.5, 1.8], "window_height_m": [1.5, 1.8, 2.1], "reveal_ g_range_m": [0.3, 0.6, 0.9], "composition": "clustered | alternating | weighted_to_corner"}, "build_logic": "Generate openings from a controlled bay grid using a deterministic composition rule. Check privacy, daylight and interior furniture constraints before finalizing.", "svg": "svgs/83_asymmetric_window_rhythm.svg"}, {"id": "84_shadow_gap_panel_facade", "name": "Shadow-Gap Modular Panel Façade", "category": "Minimalist & Contemporary Façades", "intent": "Uses crisp recessed joints between large panels to create a precise, understated architectural texture.", "elements": ["Wall", "Morph", "Beam"], "parameters": {"panel_width_m": [1.2, 1.5, 2.4], "panel_height_m": [1.2, 2.4, 3.0], "gap_width_m": [0.015, 0.025, 0.04], "panel_offset_m": [0.03, 0.06, 0.1]}, "build_logic": "Create a panel grid with consistent recessed gaps and slight panel offsets. Keep joint geometry independent from the primary wall for easy material and module changes.", "svg": "svgs/84_shadow_gap_panel_facade.svg"}, {"id": "85_structural_glass_fin_facade", "name": "Structural Glass-Fin Curtain Wall", "category": "Advanced Glazing Systems", "intent": "Uses glass fins as transparent vertical supports to minimize visual obstruction and maximize transparency.", "elements": ["CurtainWall", "Morph", "Beam"], "parameters": {"glass_fin_spacing_m": [1.2, 1.5, 1.8], "fin_depth_m": [0.2, 0.3, 0.45], "glass_thickness_m": [0.02, 0.03, 0.04], "support_type": "point_fixed | shoe_fixed"}, "build_logic": "Model the curtain wall and conceptual glass-fin planes at regular intervals. Represent fittings schematically and flag glass sizing, edge support and deflection for specialist engineering.", "svg": "svgs/85_structural_glass_fin_facade.svg"}, {"id": "86_point_supported_glazing", "name": "Point-Supported Spider Glazing", "category": "Advanced Glazing Systems", "intent": "Creates a near-frameless glass façade using discrete point fittings and a minimal supporting structure.", "elements": ["CurtainWall", "Morph", "Beam", "Column"], "parameters": {"glass_panel_width_m": [1.2, 1.5, 1.8], "glass_panel_height_m": [2.4, 3.0, 3.6], "fitting_offset_m": [0.15, 0.2, 0.25], "support_grid": "four_point | six_point"}, "build_logic": "Panelize glazing and place indicative point fittings at panel corners or specified locations. Add a secondary support frame and mark all fittings as non-engineered placeholders.", "svg": "svgs/86_point_supported_glazing.svg"}, {"id": "87_cable_net_glass_facade", "name": "Cable-Net Supported Glass Façade", "category": "Advanced Glazing Systems", "intent": "Uses a lightweight tensioned cable network to support a highly transparent glazed plane.", "elements": ["Beam", "Morph", "CurtainWall"], "parameters": {"cable_grid_m": [1.2, 1.5, 1.8], "anchor_spacing_m": [3.0, 4.5, 6.0], "glass_panel_m": [1.2, 1.5, 1.8], "preliminary_cable_diameter_m": [0.02, 0.03, 0.04]}, "build_logic": "Create cable paths and perimeter anchor locations, then place glass panels within the net grid. Geometry is conceptual; cable forces, pretension and anchors require engineering.", "svg": "svgs/87_cable_net_glass_facade.svg"}, {"id": "88_curved_insulated_glass", "name": "Curved Insulated-Glass Façade", "category": "Advanced Glazing Systems", "intent": "Creates a continuous curved glazed envelope for atria, corners or feature elevations.", "elements": ["CurtainWall", "Morph", "Beam"], "parameters": {"curve_radius_m": [3.0, 6.0, 9.0], "panel_chord_m": [0.9, 1.2, 1.5], "story_height_m": "existing_story_height", "curvature": "concave | convex | compound"}, "build_logic": "Derive a curved reference surface from the building envelope, subdivide it into manufacturable chord panels and align mullions to the curve. Confirm glass bendability with suppliers.", "svg": "svgs/88_curved_insulated_glass.svg"}, {"id": "89_gradient_fritted_glass", "name": "Gradient Ceramic-Fritted Glass Façade", "category": "Advanced Glazing Systems", "intent": "Uses printed ceramic frit with variable density to control glare, privacy and solar exposure while preserving a glazed appearance.", "elements": ["CurtainWall"], "parameters": {"frit_coverage_ratio": [0.15, 0.3, 0.5, 0.7], "gradient_axis": "bottom_to_top | center_out | solar_exposure", "dot_scale_mm": [2, 4, 6], "panel_module_m": [1.2, 1.5, 1.8]}, "build_logic": "Assign panel surface variants or graphic fills that represent frit-density zones. Keep frit patterns aligned across adjacent panels and distinguish visual representation from tested solar data.", "svg": "svgs/89_gradient_fritted_glass.svg"}, {"id": "90_multi_layer_glazing_facade", "name": "Multi-Layer Insulated Glazing Expression", "category": "Advanced Glazing Systems", "intent": "Expresses deep glazing assemblies with external fins, shadow boxes or layered transparent planes.", "elements": ["CurtainWall", "Wall", "Beam", "Morph"], "parameters": {"overall_depth_m": [0.25, 0.4, 0.6], "outer_glass_offset_m": [0.1, 0.2, 0.3], "spandrel_height_m": [0.6, 0.9, 1.2], "layer_count": [2, 3]}, "build_logic": "Model the primary weather line, secondary glass or shading plane and opaque spandrel zones as distinct assemblies. Avoid overlapping surfaces and document the intended cavity.", "svg": "svgs/90_multi_layer_glazing_facade.svg"}, {"id": "91_holographic_iridescent_skin", "name": "Iridescent Dichroic Glass Skin", "category": "Experimental & Futuristic Façades", "intent": "Creates shifting color and reflection through a secondary dichroic-glass or coated-panel layer.", "elements": ["CurtainWall", "Morph", "Beam"], "parameters": {"panel_width_m": [0.6, 1.2, 1.5], "panel_height_m": [1.2, 2.4, 3.0], "offset_from_glass_m": [0.2, 0.3, 0.45], "panel_angle_deg": [0, 10, 20]}, "build_logic": "Place a secondary panel layer over selected glazing bays and assign a user-defined iridescent surface. Treat color shift as a rendering effect, not a physical simulation.", "svg": "svgs/91_holographic_iridescent_skin.svg"}, {"id": "92_kinetic_metamorphic_facade", "name": "Metamorphic Multi-State Façade", "category": "Experimental & Futuristic Façades", "intent": "Combines several panel geometries and positions into a façade that appears to transform between defined architectural states.", "elements": ["Morph", "Beam", "CurtainWall"], "parameters": {"state_count": [2, 3, 4], "panel_module_m": [0.6, 0.9, 1.2], "maximum_rotation_deg": [30, 45, 60], "maximum_translation_m": [0.2, 0.4, 0.6]}, "build_logic": "Define named static states and generate separate geometry groups for each state. Do not animate or move elements unless the user explicitly requests it and the MCP workflow supports it.", "svg": "svgs/92_kinetic_metamorphic_facade.svg"}, {"id": "93_parametric_light_media_facade", "name": "Integrated LED Media-Grid Façade", "category": "Experimental & Futuristic Façades", "intent": "Creates a modular architectural screen capable of representing a low-resolution media or lighting display.", "elements": ["Morph", "Beam", "Wall"], "parameters": {"pixel_module_m": [0.15, 0.3, 0.45], "screen_offset_m": [0.2, 0.3, 0.45], "pixel_depth_m": [0.05, 0.08, 0.12], "grid_density": "low | medium | high"}, "build_logic": "Generate a regular pixel-support grid and representative luminous panel surfaces. Model service access and cable zones conceptually; electrical and media systems require specialist design.", "svg": "svgs/93_parametric_light_media_facade.svg"}, {"id": "94_faceted_crystalline_facade", "name": "Faceted Crystalline Envelope", "category": "Experimental & Futuristic Façades", "intent": "Uses large angular facets and shifting planes to create a crystalline architectural silhouette.", "elements": ["Morph", "CurtainWall", "Slab", "Beam"], "parameters": {"facet_width_m": [1.2, 2.4, 3.6], "facet_depth_m": [0.3, 0.6, 0.9], "facet_angle_deg": [10, 20, 35], "pattern": "irregular | directional | symmetric"}, "build_logic": "Create a controlled triangulated or polygonal envelope, offset selected vertices and generate planar facets. Resolve drainage, panelization and corner transitions.", "svg": "svgs/94_faceted_crystalline_facade.svg"}, {"id": "95_inflatable_cushion_facade", "name": "ETFE Pneumatic Cushion Façade", "category": "Experimental & Futuristic Façades", "intent": "Uses lightweight multi-layer ETFE cushion modules to create a translucent, softly curved outer envelope.", "elements": ["CurtainWall", "Morph", "Beam"], "parameters": {"cushion_width_m": [1.2, 1.5, 2.0], "cushion_height_m": [2.4, 3.0, 4.0], "cushion_depth_m": [0.2, 0.4, 0.6], "layer_count": [2, 3]}, "build_logic": "Panelize the façade into cushion bays, create shallow inflated-profile Morphs and add perimeter clamping rails. Air supply, pressure, fire and maintenance systems are not included.", "svg": "svgs/95_inflatable_cushion_facade.svg"}, {"id": "96_kinetic_shingle_envelope", "name": "Kinetic Overlapping Shingle Envelope", "category": "Experimental & Futuristic Façades", "intent": "Combines overlapping movable or fixed shingles into a textured outer layer that can vary openness and shadow.", "elements": ["Morph", "Beam", "Column"], "parameters": {"shingle_width_m": [0.3, 0.45, 0.6], "shingle_height_m": [0.6, 0.9, 1.2], "overlap_m": [0.05, 0.1, 0.15], "rotation_deg": [0, 15, 30]}, "build_logic": "Distribute shingle modules in overlapping courses on a secondary frame. Create fixed and alternate study configurations, ensuring water-shedding direction and access are considered.", "svg": "svgs/96_kinetic_shingle_envelope.svg"}]</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const grid = document.getElementById('grid');
const catSel = document.getElementById('cat');
const qEl = document.getElementById('q');
const sortEl = document.getElementById('sort');
const countEl = document.getElementById('count');
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');

const cats = [...new Set(DATA.map(d=>d.category))].sort();
cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;catSel.appendChild(o);});

const ACCENT = {
 "Solar Shading & Louver Systems":"#2c6e8f","Structural Exoskeletons & Grids":"#8a5a2b",
 "Massing & Volumetric Transformations":"#556b7a","Modular & Pixelated Skins":"#6b5b95",
 "Perforated, Cultural & Biophilic Screens":"#4a7c59","Double-Skin & Kinetic Envelopes":"#b5651d",
 "Sculptural & Parametric Signatures":"#9b3b6a","Contemporary Material & Cladding Systems":"#5a6470",
 "Parametric & Computational Geometry":"#8454a8","Organic & Biomimetic Façades":"#2e8b6f",
 "Adaptive & Intelligent Façades":"#1f7a8c","Sustainable & Energy-Generating Façades":"#3a9d4e",
 "Traditional & Cultural Architectural Façades":"#a8632d","High-Rise Architectural Expression":"#3d4a5c",
 "Minimalist & Contemporary Façades":"#6f7d8c","Advanced Glazing Systems":"#3f7fae",
 "Experimental & Futuristic Façades":"#c0397b"};

function fmtParams(p){
  if(!p||!Object.keys(p).length) return '<em style="color:var(--muted)">No parameters listed.</em>';
  let h='<ul class="params" style="padding-left:18px;margin:0">';
  for(const k in p){
    let v=p[k];
    if(Array.isArray(v)) v=v.join(' · ');
    else if(typeof v==='object') v=JSON.stringify(v);
    h+=`<li><b>${k}</b>: ${v}</li>`;
  }
  return h+'</ul>';
}

function card(d){
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`<img class="thumb" src="${d.svg}" alt="${d.name}" loading="lazy"/>
    <div class="meta"><div class="nm">${d.name}</div>
    <span class="badge">${d.category}</span></div>`;
  el.onclick=()=>openModal(d);
  return el;
}

function render(){
  const q=qEl.value.trim().toLowerCase();
  const c=catSel.value;const s=sortEl.value;
  let list=DATA.filter(d=>{
    if(c&&d.category!==c) return false;
    if(!q) return true;
    const hay=(d.name+' '+d.category+' '+d.intent+' '+d.elements.join(' ')+' '+d.build_logic).toLowerCase();
    return hay.includes(q);
  });
  if(s==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(s==='category') list.sort((a,b)=>a.category.localeCompare(b.category)||a.id.localeCompare(b.id));
  grid.innerHTML='';
  list.forEach(d=>grid.appendChild(card(d)));
  countEl.textContent=`${list.length} / ${DATA.length} façades`;
}

function openModal(d){
  const ac=ACCENT[d.category]||'#54616e';
  modal.innerHTML=`
    <div class="left"><img src="${d.svg}" alt="${d.name}"/></div>
    <div class="right">
      <div class="cat">${d.category}</div>
      <h2>${d.name}</h2>
      <div class="tags" style="margin-top:8px">
        ${d.elements.map(e=>`<span class="tag">${e}</span>`).join('')}
      </div>
      <section><h3>Architectural Intent</h3><p>${d.intent}</p></section>
      <section><h3>Parameters</h3>${fmtParams(d.parameters)}</section>
      <section><h3>Tapir Build Logic</h3><pre>${d.build_logic}</pre></section>
      <section><h3>Library ID</h3><p style="font-family:monospace;color:var(--muted)">${d.id}</p></section>
    </div>`;
  overlay.classList.add('open');
}
function closeModal(){overlay.classList.remove('open');}
document.getElementById('closeBtn').onclick=closeModal;
overlay.onclick=e=>{if(e.target===overlay)closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
qEl.oninput=render;catSel.onchange=render;sortEl.onchange=render;
render();
</script>
</body>
</html>
